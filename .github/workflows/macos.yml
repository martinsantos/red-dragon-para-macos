name: macOS build and protocol checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, check protocol and validate bundle
        run: ./script/check.sh
      - name: Package preview bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/RedragonMac.app dist/RED-DRAGON-PARA-MACOS-ci.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-preview-${{ runner.arch }}
          path: dist/RED-DRAGON-PARA-MACOS-ci.zip
          retention-days: 14
